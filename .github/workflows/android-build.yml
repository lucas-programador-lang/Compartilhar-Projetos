name: Compilar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Injetar Número da Versão Automática
      run: |
        sed -i -E 's/versionCode.*/versionCode = ${{ github.run_number }}/g' app/build.gradle*
        sed -i -E 's/versionName.*/versionName = "1.0.${{ github.run_number }}"/g' app/build.gradle*

    - name: Decodificar Chave Mestra
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo $KEYSTORE_BASE64 | base64 -d > app/chave-compartilhar.jks

    - name: Compilar o APK Oficial (Release)
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$(pwd)/app/chave-compartilhar.jks -Pandroid.injected.signing.store.password=$STORE_PASSWORD -Pandroid.injected.signing.key.alias=$KEY_ALIAS -Pandroid.injected.signing.key.password=$KEY_PASSWORD

    - name: Renomear o APK
      run: |
        cd app/build/outputs/apk/release/
        mv *.apk compartilhar-projetos.apk

    - name: Publicar APK no GitHub Releases (Link Permanente)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Atualização Automática ${{ github.run_number }}
        files: app/build/outputs/apk/release/compartilhar-projetos.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
