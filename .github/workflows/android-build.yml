name: Compilar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Injetar Número da Versão Automática
      run: |
        sed -i -r 's/versionCode[[:space:]]*=?[[:space:]]*[0-9]+/versionCode = ${{ github.run_number }}/g' app/build.gradle*
        sed -i -r 's/versionName[[:space:]]*=?[[:space:]]*"[^"]+"/versionName = "1.0.${{ github.run_number }}"/g' app/build.gradle*

    - name: Compilar o APK (Com Assinatura Automática)
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Renomear o APK
      run: |
        cd app/build/outputs/apk/debug/
        mv *.apk compartilhar-projetos.apk

    - name: Disponibilizar APK para Download (ZIP temporário)
      uses: actions/upload-artifact@v4
      with:
        name: CompartilharProjetos-APK
        path: app/build/outputs/apk/debug/compartilhar-projetos.apk

    - name: Publicar APK no GitHub Releases (Link Permanente)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Atualização Automática ${{ github.run_number }}
        files: app/build/outputs/apk/debug/compartilhar-projetos.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
